# All lengths are millimetres.
output_dir: output
output_precision: 6

io:
  comment_prefixes: ["#", "//", "$"]
  delimiter: whitespace

# Default measurement uncertainty. Each reference may override this block.
uncertainty:
  mode: constant
  sigma_xyz_mm: [0.008, 0.008, 0.008]

cframe:
  file: data/c_frame_facet.txt

plane_fit:
  ransac_iterations: 600
  ransac_threshold_mm: 0.05
  random_seed: 23

# Each reference file contains exactly one measured XYZ center point.
# nominal_center is the corresponding detector-coordinate [X, Y].
references:
  - file: data/hole_1.xyz
    nominal_center: [0.0, 0.0]
  - file: data/hole_2.xyz
    nominal_center: [0.0, 500.0]

reference_points:
  derivative_step_rad: 1.0e-7

visualization:
  dpi: 600
  sample_size: 50000
  random_seed: 23

# Optional point clouds that are transformed by the final registration.
ladder_analysis:
  enabled: true

  # segmentation:
  #   mode: segmented_files

  # sensors:
  #   - name: S0
  #     file: data/L1_000000.txt
  #   - name: S1
  #     file: data/L1_000001.txt
  #   - name: S2
  #     file: data/L1_000002.txt
  #   - name: S3
  #     file: data/L1_000003.txt
  #   - name: S4
  #     file: data/L1_000004.txt
  #   - name: S5
  #     file: data/L1_000005.txt
  #   - name: S6
  #     file: data/L1_000006.txt
  #   - name: S7
  #     file: data/L1_000007.txt
  #   - name: S8
  #     file: data/L1_000008.txt
  #   - name: S9
  #     file: data/L1_000009.txt
      
  segmentation:
    mode: automatic
    config:
      z_gap_mm: .3
      # y_center_mm: 0.0
      min_points_per_sensor: 50
  
  file: data/L1.txt