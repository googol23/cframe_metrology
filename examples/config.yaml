# Paths are relative to this YAML file; all lengths are millimetres.
io:
  output_dir: output
  output_precision: 6
  comment_prefixes: ["#", "//", "$"]
  delimiter: whitespace

visualization:
  dpi: 600
  sample_size: 50000
  random_seed: 23
  draw:
    cframe: true
    sensors: true
    full_ladders: true
    all_ladders_and_cframe: true

half_unit:
  name: example
  assembly_naming: STS8
  # Scanner-survey uncertainty shared by facet, references and ladder clouds.
  # Individual facet, fiducial, reference, ladder or sensor entries may override it.
  uncertainty:
    mode: constant
    sigma_xyz_mm: [0.008, 0.008, 0.008]
  cframe:
    file: data/c_frame_facet.txt
    normal: "+z"
    facet_offset: 0.75
    fiducials:
      file: data/cframe_fiducials.xyz
      fiducial_min_distance: 5.0
      draw: true
      marker: "x"
    plane_fit:
      ransac_iterations: 600
      ransac_threshold_mm: 0.05
      random_seed: 23
    references:
      - file: data/hole_1.xyz
        nominal_center: [0.0, 0.0]
      - file: data/hole_2.xyz
        nominal_center: [0.0, 500.0]
    reference_points:
      derivative_step_rad: 1.0e-7
  ladders:
    L3DL0:
      segmentation:
        mode: automatic
        config:
          z_gap_mm: 0.3
          min_points_per_sensor: 50
      file: data/L3DL0.txt
    L3DL1:
      segmentation:
        mode: segmented_files
      sensors:
        - { name: L1T0, file: data/L1T0.txt }
        - { name: L1T1, file: data/L1T1.txt }

# Optional nominal registration. When enabled, each participating ladder needs
# a geometry_file and an exact measurement_frame matching its ROOT export.
# registration:
#   enabled: true
#   measurement_frame: global
#   uncertainty_sigma: 3.0 # Multiplier of point-cloud sigma, not a second sigma.
#   draw: true
#   ladders:
#     L3DL0:
#       geometry_file: data/L3DL0_geometry.json
#       max_translation_mm: 2.0

ladder_analysis:
  enabled: true
  analyze_individual_sensors: true
  visualization:
    individual_plot_workers: 4
